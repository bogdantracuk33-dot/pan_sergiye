html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:fixed;padding:40px 36px 36px}
.bl{left:0;bottom:0;transform-origin:0 100%}.br{right:0;bottom:0;transform-origin:100% 100%}
.tl{left:0;top:0;transform-origin:0 0}.tr{right:0;top:0;transform-origin:100% 0}
.c{left:50%;top:50%}
.card{--c:#ff9f43;--d:1;position:relative;display:flex;align-items:center;gap:16px;min-width:340px;padding:14px 34px 14px 14px;border-radius:26px;color:#fff;border:2px solid var(--c);box-shadow:0 0 20px var(--c),0 0 56px color-mix(in srgb,var(--c) 50%,transparent);opacity:0}
.card>*{position:relative;z-index:1}
.card>.bgw{position:absolute;inset:0;z-index:0;border-radius:24px;overflow:hidden}
.bgw::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,7,3,.88),rgba(20,7,3,.5)),var(--photo) 50% 30%/cover;animation:pan 9s ease-in-out infinite alternate}
.bgw::after{content:"";position:absolute;inset:0;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 0,rgba(255,150,30,.42) 20%,rgba(215,38,61,.38) 40%,rgba(255,210,63,.4) 60%,rgba(255,110,20,.4) 80%,transparent 100%);background-size:300% 100%;animation:flow 5s linear infinite}
@keyframes pan{to{background-position:0 0,50% 80%;transform:scale(1.08)}}
@keyframes flow{to{background-position:-300% 0}}
.card.in{animation:sin .8s cubic-bezier(.2,1.2,.4,1) forwards}
.card.out{animation:sout .6s ease-in forwards}
@keyframes sin{0%{opacity:0;transform:translateX(calc(var(--d)*-90px)) scale(.8)}60%{opacity:1;transform:translateX(calc(var(--d)*8px)) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes sout{0%{opacity:1}100%{opacity:0;transform:translateX(calc(var(--d)*-90px)) scale(.85)}}
.ico{position:relative;flex:none;width:76px;height:76px;display:grid;place-items:center;border-radius:22px;color:var(--c);border:2px solid var(--c);background:rgba(20,7,3,.55);box-shadow:0 0 18px var(--c),inset 0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.in .ico{animation:ip 1s .15s cubic-bezier(.2,1.6,.4,1) backwards}
.ico::after{content:"";position:absolute;inset:-2px;border-radius:22px;border:2px solid var(--c);animation:rip 1.8s 1s ease-out infinite}
.ico svg{width:42px;height:42px;fill:currentColor;filter:drop-shadow(0 0 8px var(--c))}
@keyframes ip{from{transform:rotate(-200deg) scale(0)}}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.tag{font:800 13px Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--c);text-shadow:0 0 10px var(--c);margin-bottom:2px}
.nm{font:800 31px/1.15 Unbounded,Impact,sans-serif;text-shadow:0 2px 6px #000a,0 0 18px var(--c);white-space:nowrap}
.nm.sm{font-size:20px;letter-spacing:.02em}
.tag.big{display:inline-block;padding:4px 14px;margin-bottom:7px;border-radius:9px;font:800 17px Unbounded,Impact,sans-serif;letter-spacing:.2em;color:#fff;background:var(--c);text-shadow:0 1px 3px #0009;box-shadow:0 0 16px var(--c),0 0 36px color-mix(in srgb,var(--c) 60%,transparent)}
.ico.coin svg{animation:coin 2.6s linear infinite}
@keyframes coin{to{transform:rotateY(360deg)}}
.ch{display:inline-block;animation:cu .5s backwards}
@keyframes cu{from{opacity:0;transform:translateY(16px) scale(.6)}}
.sub{position:absolute!important;z-index:3!important;top:-19px;right:20px;display:flex;align-items:center;gap:7px;padding:7px 14px 7px 11px;border-radius:999px;font:800 13px Manrope,sans-serif;letter-spacing:.1em;color:#2b0f04;background:linear-gradient(120deg,#ffe066,#ff9d00);box-shadow:0 0 18px #ffb21a,0 0 40px rgba(255,140,0,.6);overflow:hidden;opacity:0}
.in .sub{animation:bpop .6s 1s cubic-bezier(.2,1.7,.4,1) forwards,bpulse 1.4s 1.7s ease-in-out infinite}
.sub::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#fff9 50%,transparent 65%);transform:translateX(-130%);animation:bsh 2s 1.7s infinite}
.sub svg{width:17px;height:17px;fill:#2b0f04;transform-origin:50% 10%;animation:bell 1.4s 1.7s ease-in-out infinite}
@keyframes bpop{from{opacity:0;transform:translateY(14px) scale(.3)}to{opacity:1;transform:none}}
@keyframes bpulse{50%{transform:scale(1.1);box-shadow:0 0 28px #ffc533,0 0 60px rgba(255,140,0,.9)}}
@keyframes bsh{0%{transform:translateX(-130%)}60%,100%{transform:translateX(130%)}}
@keyframes bell{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}}
.sp{position:absolute;left:52px;top:50%;width:9px;height:9px;border-radius:50% 0;background:var(--c);box-shadow:0 0 10px var(--c);pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:2}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
</style>
</head>

:root{
  --ink:#eaf5e6; --ink-2:#c7dcc9; --muted:#7ea488;
  --accent:#3dff2e; --lime:#b6ff42; --deep:#0b8f1e;

  --f-display:'Russo One','Arial Black',Impact,sans-serif;
  --f-body:'Fira Sans Condensed','Arial Narrow','Roboto Condensed',Inter,sans-serif;

  --tile:inset(0 calc(100% - 76px) 0 0);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:var(--f-body);color:var(--ink)}

#wrap{position:fixed;bottom:var(--bottom);width:300px;height:76px;transform:scale(var(--scale))}
#wrap.left {left:var(--edge); transform-origin:bottom left; --dir:-1;--tile:inset(0 calc(100% - 76px) 0 0)}
#wrap.right{right:var(--edge);transform-origin:bottom right;--dir:1; --tile:inset(0 0 0 calc(100% - 76px))}

/* зрізані кути (ui.css) */
.hud{--c:12px;--line:rgba(61,255,46,.36);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  background-image:
    linear-gradient(135deg,transparent 50%,var(--line) 50%,var(--line) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(135deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) 50%,transparent 50%);
  background-position:0 0,100% 100%;background-size:var(--c) var(--c),var(--c) var(--c);background-repeat:no-repeat;
  background-color:rgba(2,10,5,.9);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- 1. ЛОГО ---------- */
.logo{position:absolute;top:10px;width:56px;height:56px;z-index:5;visibility:hidden;
  filter:drop-shadow(0 0 12px rgba(61,255,46,.5))}
#wrap.left .logo{left:10px}#wrap.right .logo{right:10px}
.logo ur-logo{width:100%;height:100%}
.s-fly .logo{visibility:visible;animation:lgIn 1.15s cubic-bezier(.2,.8,.25,1) both}
.s-out .logo{animation:lgOut .75s cubic-bezier(.6,0,.9,.4) both}
@keyframes lgIn{
  0%  {transform:translateX(calc(var(--dir)*170px)) rotate(calc(var(--dir)*600deg)) scale(.45);opacity:0}
  20% {opacity:1}
  62% {transform:translateX(calc(var(--dir)*-12px)) rotate(calc(var(--dir)*-14deg)) scale(1.12)}
  82% {transform:translateX(calc(var(--dir)*4px)) rotate(calc(var(--dir)*4deg)) scale(.98)}
  100%{transform:none;opacity:1}}
@keyframes lgOut{
  0%  {transform:none;opacity:1}
  22% {transform:translateX(calc(var(--dir)*-8px)) rotate(calc(var(--dir)*-10deg)) scale(1.1)}
  100%{transform:translateX(calc(var(--dir)*190px)) rotate(calc(var(--dir)*640deg)) scale(.45);opacity:0}}
.ping{position:absolute;top:38px;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;pointer-events:none;z-index:4}
#wrap.left .ping{left:38px}#wrap.right .ping{right:38px;margin-right:-28px;margin-left:0}
.s-fly .ping{animation:ping 1s ease-out .75s both}
.s-fly .ping.b{animation-delay:1s}
@keyframes ping{0%{transform:scale(.7);opacity:.85}100%{transform:scale(2.6);opacity:0}}

/* ---------- 2. ПЛАШКА виїжджає з лого ---------- */
.pbox{position:absolute;inset:0;clip-path:var(--tile);filter:drop-shadow(0 0 14px rgba(61,255,46,.22))}
.s-grow .pbox{animation:grow .85s cubic-bezier(.65,0,.15,1) both}
.s-shrink .pbox{animation:shrink .75s cubic-bezier(.65,0,.35,1) both}
@keyframes grow  {from{clip-path:var(--tile)}to{clip-path:inset(0 0 0 0)}}
@keyframes shrink{0%{clip-path:inset(0 0 0 0);opacity:1}65%{opacity:1}100%{clip-path:var(--tile);opacity:0}}
.plate{position:absolute;inset:0;--c:14px;opacity:0}
.s-grow .plate{animation:fadeIn .3s ease both}
@keyframes fadeIn{to{opacity:1}}
.plate::before{content:'';position:absolute;inset:0;opacity:.55;
  background:repeating-linear-gradient(0deg,rgba(61,255,46,.04) 0 1px,transparent 1px 3px)}
.plate::after{content:'';position:absolute;top:0;bottom:0;width:56px;left:-90px;
  background:linear-gradient(100deg,transparent,rgba(182,255,66,.32),transparent);transform:skewX(-20deg)}
.s-grow .plate::after{animation:shine 1s ease .35s both}
@keyframes shine{from{left:-90px}to{left:340px}}
#wrap.right .plate::after{display:none}

/* ---------- тіло: назва/заклик + іконки ---------- */
.body{position:absolute;top:9px;bottom:9px;display:flex;flex-direction:column;gap:5px}
#wrap.left  .body{left:78px;right:14px}
#wrap.right .body{left:14px;right:78px}
.row1{position:relative;height:32px;overflow:hidden}
.row1 > *{position:absolute;left:0;top:0}

/* назва: проявляється, а потім виїжджає вгору */
.nm{width:108px;height:32px;clip-path:inset(0 100% 0 0)}
.nm ur-logo{width:108px;height:32px}
.nm::after{content:'';position:absolute;top:2px;bottom:2px;width:2px;left:0;background:#c9ffa8;box-shadow:0 0 10px #4dff2e;opacity:0}
.s-name .nm{animation:nmIn .8s cubic-bezier(.55,0,.2,1) both}
.s-name .nm::after{animation:scan .8s cubic-bezier(.55,0,.2,1) both}
@keyframes nmIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes scan{0%{left:0;opacity:1}90%{opacity:1}100%{left:106px;opacity:0}}
.s-cta .nm{animation:nmOut .5s cubic-bezier(.6,0,.9,.4) both}
@keyframes nmOut{from{transform:none;opacity:1;clip-path:inset(0 0 0 0)}to{transform:translateY(-120%);opacity:0;clip-path:inset(0 0 0 0)}}

/* заклик на місці назви: літери піднімаються по черзі */
.cta{height:32px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.cta svg{width:17px;height:17px;flex:none;color:var(--accent);fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(61,255,46,.8));opacity:0;transform:translateY(-10px)}
.s-cta .cta svg{animation:arIn .4s ease .2s both,bob .9s ease-in-out .8s infinite}
@keyframes arIn{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(-2.5px)}50%{transform:translateY(2.5px)}}
.txt{display:inline-block;overflow:hidden;font:700 14.5px/22px var(--f-body);letter-spacing:.2px;color:var(--ink);text-shadow:0 0 12px rgba(61,255,46,.4)}
.ch{display:inline-block;transform:translateY(120%);opacity:0}
.s-cta .cta .ch{animation:chIn .5s cubic-bezier(.2,.9,.3,1) calc(var(--j)*28ms + .25s) both}
.s-bye .cta{animation:ctaOut .4s cubic-bezier(.6,0,.9,.4) both}
@keyframes chIn{from{transform:translateY(120%) rotate(8deg);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
@keyframes ctaOut{to{transform:translateY(120%);opacity:0}}

/* іконки на плашці */
.row2{display:flex;align-items:center;gap:4px;height:22px}
.chip{--c:5px;--k:var(--accent);--line:color-mix(in srgb,var(--k) 55%,transparent);
  height:22px;min-width:22px;display:flex;align-items:center;color:var(--k);overflow:hidden;white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--line);
  background-color:rgba(2,10,5,.92);transform:scale(0);opacity:0;
  transition:background-color .3s,box-shadow .3s}
.ico{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.ico svg{width:14px;height:14px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lab{display:flex;align-items:center;gap:4px;max-width:0;transition:max-width .5s cubic-bezier(.2,.9,.25,1);
  font:700 12px/22px var(--f-body);letter-spacing:.3px;color:var(--ink)}
.lab .ar{width:9px;height:9px;flex:none;fill:none;stroke:var(--k);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
.lab .t{display:inline-block;overflow:hidden;padding-right:7px}
.chip.on{background-color:color-mix(in srgb,var(--k) 20%,rgba(2,10,5,.94));
  box-shadow:inset 0 0 0 1px var(--k),inset 0 0 10px color-mix(in srgb,var(--k) 30%,transparent)}
.chip.on .lab{max-width:80px}
.chip.on .ar{animation:draw .35s ease .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chip.on .lab .ch{animation:chIn .45s cubic-bezier(.2,.9,.3,1) calc(var(--j)*40ms + .22s) both}

.s-icons .chip{animation:icIn .55s cubic-bezier(.3,1.8,.5,1) calc(var(--i)*.09s) both}
.s-bye .chip{animation:icOut .3s cubic-bezier(.6,0,.9,.4) calc((4 - var(--i))*.05s) both}
@keyframes icIn {from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes icOut{from{transform:none;opacity:1}to{transform:scale(0) rotate(90deg);opacity:0}}

.k-al{--k:var(--red)}.k-th{--k:var(--amber)}.k-rn{--k:var(--lime)}.k-rd{--k:var(--accent)}.k-ch{--k:var(--cyan)}

/* живі мікро-анімації іконок */
.k-al .tri{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.k-rn .reg{fill:var(--lime);stroke:none;opacity:.05;animation:reg 2.2s ease-in-out infinite}
@keyframes reg{50%{opacity:.55}}
.k-ch .d{fill:currentColor;stroke:none;animation:typ 1.2s ease-in-out infinite}
.k-ch .d:nth-of-type(2){animation-delay:.18s}.k-ch .d:nth-of-type(3){animation-delay:.36s}
@keyframes typ{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>

<div id="wrap" class="left">
  <div class="ping"></div><div class="ping b"></div>
  <div class="logo"><ur-logo variant="mark"></ur-logo></div>

  <div class="pbox">
    <div class="plate hud"></div>
    <div class="body">
      <div class="row1">
        <div class="nm"><ur-logo variant="wordmark"></ur-logo></div>
        <div class="cta">
          <svg viewBox="0 0 24 24"><path d="M12 3v16"/><path d="M5 12.5 12 20l7-7.5"/></svg>
          <span class="txt" data-split="Посилання під стрімом"></span>

      </div>
      <div class="row2">

          <span class="lab"><svg class="ar" viewBox="0 0 10 10"><path d="M1 5h7M5 1.5 8.5 5 5 8.5"/></svg><span class="t" data-split="Тривоги"></span></span>

            <circle r="1.9" fill="currentColor" stroke="none"><animateMotion dur="2.4s" repeatCount="indefinite" path="M5 7C8 9 10 10 12 12S16 16 19 17"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></circle></svg></span>
          <span class="lab"><svg class="ar" viewBox="0 0 10 10"><path d="M1 5h7M5 1.5 8.5 5 5 8.5"/></svg><span class="t" data-split="Загрози"></span></span>
        </div>
        <div class="chip hud k-rn" style="--i:2">
          <span class="ico"><svg viewBox="0 0 24 24"><path class="reg" d="M12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5z"/><path d="M12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5zM12 12 20 7.5M12 12v9M12 12 4 7.5"/></svg></span>
          <span class="lab"><svg class="ar" viewBox="0 0 10 10"><path d="M1 5h7M5 1.5 8.5 5 5 8.5"/></svg><span class="t" data-split="Райони"></span></span>
        </div>
        <div class="chip hud k-rd" style="--i:3">
          <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5"/>
            <g><path d="M12 12V2.5"/><path d="M12 12 6.5 4.8A9.5 9.5 0 0 0 12 2.5z" fill="currentColor" fill-opacity=".28" stroke="none"/>
            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="2s" repeatCount="indefinite"/></g></svg></span>
          <span class="lab"><svg class="ar" viewBox="0 0 10 10"><path d="M1 5h7M5 1.5 8.5 5 5 8.5"/></svg><span class="t" data-split="Радар"></span></span>
        </div>
        <div class="chip hud k-ch" style="--i:4">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-8l-5 4v-4H4A1.5 1.5 0 0 1 2.5 15V6A1.5 1.5 0 0 1 4 4.5z"/>
            <circle class="d" cx="8" cy="10.5" r="1.4"/><circle class="d" cx="12" cy="10.5" r="1.4"/><circle class="d" cx="16" cy="10.5" r="1.4"/></svg></span>
          <span class="lab"><svg class="ar" viewBox="0 0 10 10"><path d="M1 5h7M5 1.5 8.5 5 5 8.5"/></svg><span class="t" data-split="Чат"></span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   <ur-logo> — Ukraine Radar logo, fully vector, animated.
   variants:  full      radar emblem + "UKRAINE RADAR" inside the outer ring
              mark      radar emblem only (UR + radar), for headers / buttons
              wordmark  stencil "UKRAINE / RADAR" only
   The sweep rotates continuously (SMIL, no JS per frame). The radar centre is
   intentionally empty: no dot, the beam apex and the crosshair both fade out
   before they reach it.
   ========================================================================== */
(function () {
  'use strict';

  /* ---- geometry, traced from the reference artwork (1254 x 1254 space) ---- */
    var UR = [                                   // the "UR" monogram
    '421,269 514,269 514,559 557,559 557,636 481,636 421,568',   // U left
    '628,271 716,272 716,567 657,636 586,636 586,560 628,559',   // U right (also R stem)
    '741,345 828,345 869,397 869,470 834,511 741,511 741,466 797,466 797,399 741,399', // R bowl
    '744,528 828,528 890,628 807,628'                             // R leg
  ];
  var WORD_TOP = [                             // UKRAINE (white)
    '228,687 263,687 263,772 280,772 280,793 252,793 228,769',
    '340,687 305,687 305,772 288,772 288,793 316,793 340,769',
    '356,687 391,687 391,793 356,793',
    '470,687 431,687 398,723 398,767 457,704',
    '434,740 436,740 466,782 472,793 432,793 413,766 413,762',
    '484,687 517,687 517,793 484,793',
    '525,687 570,687 590,707 590,739 571,758 591,793 555,793 537,760 525,758 525,739 551,739 555,735 555,712 552,709 525,709',
    '640,695 655,731 631,793 598,793 637,696',
    '645,687 677,688 725,793 689,793 682,778 644,778 651,758 674,757',
    '737,687 772,687 772,793 737,793',
    '795,700 799,702 827,743 827,793 796,793',
    '798,687 835,687 908,793 871,793',
    '877,687 909,687 909,778 877,735',
    '931,687 965,687 965,729 1003,729 1003,749 965,750 965,793 931,793',
    '972,687 1026,687 1026,712 997,712 995,708 972,708',
    '972,771 996,771 997,767 1026,767 1026,793 972,793'
  ];
  var WORD_BOT = [                             // RADAR (green)
    '355,815 383,815 383,909 355,909',
    '392,815 433,815 450,832 450,863 434,879 452,909 420,909 402,880 391,880 391,861 416,861 420,858 420,839 417,836 392,836',
    '501,822 513,856 492,909 462,909 498,823',
    '505,815 532,815 575,909 544,909 538,896 504,896 512,877 530,876',
    '587,815 616,815 616,909 587,909',
    '625,815 661,815 682,836 682,888 661,909 624,909 624,888 647,888 651,884 652,841 646,836 624,836',
    '725,823 738,855 717,909 687,909 723,823',
    '731,815 759,815 799,909 768,909 762,896 729,896 736,877 755,876',
    '811,815 839,815 839,909 810,909',
    '846,815 887,815 906,833 906,862 889,879 907,909 875,909 857,880 846,880 846,861 872,861 875,858 875,839 872,836 846,836'
  ];

  function polys(list, cls) {
    return list.map(function (p) { return '<polygon class="' + cls + '" points="' + p + '"/>'; }).join('');
  }

  /* sweep trail: N thin wedges behind the beam, fading out (beam points north) */
  function sweepWedges(cx, cy, R, n, step) {
    var out = '';
    for (var i = 0; i < n; i++) {
      var a1 = -(i + 1) * step * Math.PI / 180, a2 = -i * step * Math.PI / 180;
      var x1 = cx + R * Math.sin(a1), y1 = cy - R * Math.cos(a1);
      var x2 = cx + R * Math.sin(a2), y2 = cy - R * Math.cos(a2);
      var o = (0.34 * Math.pow(1 - i / n, 1.7)).toFixed(3);
      out += '<path d="M' + cx + ' ' + cy + 'L' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
             'A' + R + ' ' + R + ' 0 0 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + 'Z" fill-opacity="' + o + '"/>';
    }
    return out;
  }

  var SWEEP_PERIOD = 4;           // seconds per revolution
  var BLIP_ANGLE = 59;            // degrees clockwise from north

  function build(variant) {
    var full = variant === 'full', mark = variant === 'mark', word = variant === 'wordmark';
    /* one centre for the ring, the range rings, the crosshair and the sweep */
    var cx = full ? 623 : 625, cy = full ? 597 : 462;
    var ringR = full ? 534 : 434;
    var R = ringR - 8;                                   // sweep reaches the inside of the ring
    var radii = full ? [185, 305, 425] : [135, 245, 355];
    var holeR = full ? 135 : 105;                        // clean, empty centre
    var vb = full ? '48 22 1150 1150' : mark ? '150 -13 950 950' : '214 676 826 245';
    var bR = R * 0.8;
    var bx = cx + bR * Math.sin(BLIP_ANGLE * Math.PI / 180);
    var by = cy - bR * Math.cos(BLIP_ANGLE * Math.PI / 180);
    var tHit = (BLIP_ANGLE / 360 * SWEEP_PERIOD).toFixed(3);

    var defs =
      '<defs>' +
      '<linearGradient id="gU" gradientUnits="userSpaceOnUse" x1="0" y1="269" x2="0" y2="636">' +
        '<stop offset="0" stop-color="#c9ff4d"/><stop offset=".42" stop-color="#57ff2e"/><stop offset="1" stop-color="#0b8f1e"/></linearGradient>' +
      '<linearGradient id="gW" gradientUnits="userSpaceOnUse" x1="0" y1="687" x2="0" y2="793">' +
        '<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6d9d0"/></linearGradient>' +
      '<linearGradient id="gG" gradientUnits="userSpaceOnUse" x1="0" y1="815" x2="0" y2="909">' +
        '<stop offset="0" stop-color="#b6ff42"/><stop offset=".55" stop-color="#4dff2c"/><stop offset="1" stop-color="#23d21f"/></linearGradient>' +
      '<linearGradient id="gBeam" gradientUnits="userSpaceOnUse" x1="0" y1="' + cy + '" x2="0" y2="' + (cy - R) + '">' +
        '<stop offset="0" stop-color="#e2ffb0" stop-opacity="0"/><stop offset=".45" stop-color="#e2ffb0" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>' +
      '<radialGradient id="gHole" gradientUnits="userSpaceOnUse" cx="' + cx + '" cy="' + cy + '" r="' + holeR + '"><stop offset="0" stop-color="#000" stop-opacity="1"/><stop offset=".6" stop-color="#000" stop-opacity=".92"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>' +
      '<mask id="mRadar" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1500" height="1500">' +
        '<rect x="-100" y="-100" width="1500" height="1500" fill="#fff"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + holeR + '" fill="url(#gHole)"/></mask>' +
      '<clipPath id="cDisc"><circle cx="' + cx + '" cy="' + cy + '" r="' + (ringR - 6) + '"/></clipPath>' +
      '<filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="' + (mark ? 14 : 11) + '"/></filter>' +
      '<filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>' +
      '</defs>';

    var rings = radii.map(function (r, i) {
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" class="ring' + (i === 0 ? ' dash' : '') + '"/>';
    }).join('');

    /* ---- radar layer ---- */
    var radar =
      '<g clip-path="url(#cDisc)"><g mask="url(#mRadar)">' +
        rings +
        '<line x1="' + (cx - R) + '" y1="' + cy + '" x2="' + (cx + R) + '" y2="' + cy + '" class="cross"/>' +
        '<line x1="' + cx + '" y1="' + (cy - R) + '" x2="' + cx + '" y2="' + (cy + R) + '" class="cross"/>' +
        '<g id="sweep">' +
          '<g fill="#4dff2e">' + sweepWedges(cx, cy, R, 44, 1.35) + '</g>' +
          '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - R) + '" stroke="#4dff2e" stroke-width="9" opacity=".35" filter="url(#fSoft)"/>' +
          '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - R) + '" stroke="url(#gBeam)" stroke-width="3.2" stroke-linecap="round"/>' +
          '<animateTransform attributeName="transform" type="rotate" from="0 ' + cx + ' ' + cy + '" to="360 ' + cx + ' ' + cy + '" dur="' + SWEEP_PERIOD + 's" repeatCount="indefinite"/>' +
        '</g>' +
      '</g>' +
      /* target blip: lights up as the beam passes, then fades like phosphor */
      '<g>' +
        '<circle cx="' + bx.toFixed(1) + '" cy="' + by.toFixed(1) + '" r="9" fill="#eaffd0" opacity=".12">' +

<script>
(function(){
  var q = new URLSearchParams(window.__P||''), wrap = document.getElementById('wrap');
  var side = q.get('side') === 'right' ? 'right' : 'left';
  wrap.className = side;
  var rs = document.documentElement.style;
  if (q.get('scale'))  rs.setProperty('--scale', q.get('scale'));
  if (q.get('bottom')) rs.setProperty('--bottom', q.get('bottom') + 'px');
  if (q.get('edge'))   rs.setProperty('--edge', q.get('edge') + 'px');
  var test = q.get('test') === '1';
  var gap = q.get('gap') !== null ? Math.max(0, +q.get('gap')) : 120;

  /* розбиваємо підписи на літери для покрокової анімації */
  Array.prototype.forEach.call(document.querySelectorAll('[data-split]'), function(el){
    el.innerHTML = el.getAttribute('data-split').split('').map(function(c, j){
      return '<span class="ch" style="--j:' + j + '">' + (c === ' ' ? '&nbsp;' : c) + '</span>';
    }).join('');
  });

  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip')), timers = [], cyc = null;
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  var cls = [];
  function add(c){ cls.push(c); wrap.className = side + ' ' + cls.join(' '); }
  function reset(){ cls = []; wrap.className = side; chips.forEach(function(c){ c.classList.remove('on'); }); }

  function cycle(){
    var i = 0;
    function step(){
      chips.forEach(function(c){ c.classList.remove('on'); });
      if (i < chips.length) chips[i].classList.add('on');
      i++;
    }
    step(); cyc = setInterval(function(){
      if (i > chips.length){ clearInterval(cyc); return; }
      step();
    }, 1250);
  }

  function play(){
    timers.forEach(clearTimeout); clearInterval(cyc); timers = [];
    reset(); void wrap.offsetWidth;
    at(100,   function(){ add('s-fly');  });          // 1. лого вилітає і крутиться
    at(1150,  function(){ add('s-grow'); });          // 2. з лого виїжджає плашка
    at(1750,  function(){ add('s-name'); });          // 3. проявляється назва
    at(2650,  function(){ add('s-icons'); });         // 4. іконки лягають на плашку
    at(3700,  cycle);                                 //    по черзі розкриваються з підписами
    at(10100, function(){                             // 5. назва → «Посилання під стрімом»
      chips.forEach(function(c){ c.classList.remove('on'); });
      add('s-cta');
    });
    at(14100, function(){ add('s-bye'); });           // 6. все складається
    at(14900, function(){ add('s-shrink'); });        //    плашка втягується в лого
    at(15700, function(){ add('s-out'); });           //    лого відлітає
    at(16700, function(){
      reset();
      if (test) play(); else if (gap > 0) at(gap * 1000, play);
    });
  }
  setTimeout(play, 600);
})();
